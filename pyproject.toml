[project]
name = "smartctx"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["model2vec>=0.3", "numpy>=1.24"]

[project.scripts]
smartctx = "smartctx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
rules = ["llama-cpp-python>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartctx"]
# Ship the vendored default embedding model (non-Python data) inside the wheel.
artifacts = ["src/smartctx/models/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/smartctx/models/**"]
