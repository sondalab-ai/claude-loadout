[project]
name = "ccloadout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["model2vec>=0.3", "numpy>=1.24"]

[project.scripts]
loadout = "ccloadout.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
rules = ["llama-cpp-python>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccloadout"]
# Ship the vendored default embedding model (non-Python data) inside the wheel.
artifacts = ["src/ccloadout/models/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/ccloadout/models/**"]
