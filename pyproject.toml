[project]
name = "ccloadout"
version = "0.1.0"
description = "Goal-aware launcher for Claude Code — load only the MCP servers, plugins, and skills each session needs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Marcello Barile" }]
keywords = ["claude-code", "claude", "mcp", "llm", "cli", "developer-tools", "context-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = ["model2vec>=0.3", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/marcellobarile/claude-loadout"
Repository = "https://github.com/marcellobarile/claude-loadout"
Issues = "https://github.com/marcellobarile/claude-loadout/issues"

[project.scripts]
loadout = "ccloadout.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
rules = ["llama-cpp-python>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccloadout"]
# Ship the vendored default embedding model (non-Python data) inside the wheel.
artifacts = ["src/ccloadout/models/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/ccloadout/models/**"]
